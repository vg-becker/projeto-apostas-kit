services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apostas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apostas_local}
      POSTGRES_DB: ${POSTGRES_DB:-apostas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apostas}"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues | grep -q wager-transactions-dlq"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local}
      KC_HEALTH_ENABLED: "true"
      # Fixa o emissor (claim iss) dos tokens, não importa por onde o Keycloak é acessado:
      # o app o alcança pela rede interna, e os clientes pelo host.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      APP_HTTP_ADDR: ":8081"
      APP_MIGRATE_ON_START: "true"
      APP_MIGRATIONS_DIR: /migrations
      DATABASE_URL: postgres://${POSTGRES_USER:-apostas}:${POSTGRES_PASSWORD:-apostas_local}@postgres:5432/${POSTGRES_DB:-apostas}?sslmode=disable
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/apostas
      OIDC_JWKS_URL: http://keycloak:8080/realms/apostas/protocol/openid-connect/certs
      OIDC_AUDIENCE: apostas-api
      OIDC_INTERNAL_SCOPE: wallet:internal
    ports:
      - "8081:8081"

volumes:
  postgres-data:
